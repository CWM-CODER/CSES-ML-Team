services:
  - type: web
    name: chromatic-reflex
    runtime: python
    plan: free
    rootDir: ARPIT_YADAV/Week_06/CHROMATIC_PROJECT_CSES_ML/chromatic_reflex
    buildCommand: "cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
