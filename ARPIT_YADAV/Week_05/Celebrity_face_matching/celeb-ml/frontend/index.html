<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Celebrity Face Matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090e;
    --card: rgba(18, 22, 34, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --card-hover: rgba(255, 255, 255, 0.12);
    --ink: #f1f5f9;
    --ink-muted: #94a3b8;
    --ink-dim: #64748b;
    --accent-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
    --accent-glow: rgba(168, 85, 247, 0.35);
    --amber: #f59e0b;
    --cyan: #06b6d4;
    --radius-xl: 24px;
    --radius-lg: 16px;
    --radius-md: 12px;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  
  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 15% 20%, rgba(99, 102, 241, 0.18) 0%, transparent 45%),
      radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15) 0%, transparent 45%),
      radial-gradient(circle at 50% 85%, rgba(6, 182, 212, 0.12) 0%, transparent 50%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: "Plus Jakarta Sans", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    overflow-x: hidden;
  }

  h1, h2, h3 { 
    font-family: "Syne", "Plus Jakarta Sans", sans-serif; 
    line-height: 1.15; 
    margin: 0; 
    font-weight: 800;
  }

  button { 
    font: inherit; 
    cursor: pointer; 
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  :focus-visible { 
    outline: 2px solid #a855f7; 
    outline-offset: 4px; 
  }

  .page { 
    max-width: 1140px; 
    margin: 0 auto; 
    padding: 48px 24px 80px; 
  }

  /* Header Section */
  header { 
    max-width: 42rem; 
    margin-bottom: 38px; 
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(168, 85, 247, 0.28);
    color: #c4b5fd;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 18px;
    backdrop-filter: blur(8px);
  }

  .badge-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 10px #34d399;
    animation: pulseDot 2s infinite ease-in-out;
  }

  @keyframes pulseDot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  header h1 { 
    font-size: clamp(2.4rem, 5vw, 3.8rem); 
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #ffffff 40%, #e0e7ff 75%, #f472b6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p { 
    margin: 16px 0 0; 
    color: var(--ink-muted); 
    font-size: 1.08rem;
    max-width: 36rem;
    line-height: 1.6;
  }

  /* Main Grid Layout */
  .layout { 
    display: grid; 
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); 
    gap: 32px; 
    align-items: start; 
  }

  @media (max-width: 900px) { 
    .layout { grid-template-columns: 1fr; gap: 28px; } 
    .page { padding: 32px 18px 60px; }
  }

  /* Viewfinder / Camera Card */
  .finder-wrapper {
    background: var(--card);
    border-radius: var(--radius-xl);
    padding: 24px;
    border: 1px solid var(--card-border);
    backdrop-filter: blur(24px);
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
  }

  .finder {
    position: relative;
    aspect-ratio: 4 / 3;
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #090c14;
    border: 1px solid rgba(255, 255, 255, 0.06);
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
  }

  .finder video {
    position: absolute; 
    inset: 0; 
    width: 100%; 
    height: 100%;
    object-fit: cover; 
    transform: scaleX(-1);
    display: none;
  }

  .finder.live video { display: block; }

  /* Idle State in Viewfinder */
  .finder .idle {
    position: absolute; 
    inset: 0; 
    display: flex; 
    flex-direction: column;
    align-items: center; 
    justify-content: center; 
    gap: 18px; 
    padding: 32px 24px; 
    text-align: center;
    background: radial-gradient(circle at center, rgba(30, 41, 59, 0.6) 0%, rgba(9, 12, 20, 0.95) 100%);
  }

  .finder.live .idle { display: none; }

  .idle-icon-wrap {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(99, 102, 241, 0.12);
    border: 1px solid rgba(168, 85, 247, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #c4b5fd;
    box-shadow: 0 0 24px rgba(168, 85, 247, 0.2);
  }

  .idle-icon-wrap svg {
    width: 32px;
    height: 32px;
  }

  .finder .idle p { 
    margin: 0; 
    max-width: 22rem; 
    color: var(--ink-muted); 
    font-size: 0.98rem;
  }

  /* Viewfinder HUD Elements */
  .frame, .guide { 
    position: absolute; 
    pointer-events: none; 
    display: none; 
  }

  .finder.live .frame, .finder.live .guide { display: block; }

  .frame { inset: 18px; }
  .frame i { 
    position: absolute; 
    width: 30px; 
    height: 30px; 
    border: 0 solid #a855f7; 
    filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.8));
  }
  .frame i:nth-child(1) { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 8px; }
  .frame i:nth-child(2) { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 8px; }
  .frame i:nth-child(3) { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 8px; }
  .frame i:nth-child(4) { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 8px; }

  .guide {
    left: 50%; 
    top: 50%; 
    width: 44%; 
    height: 76%;
    transform: translate(-50%, -50%);
    border: 2px dashed rgba(255, 255, 255, 0.4);
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(255, 255, 255, 0.1);
    transition: all 0.3s ease;
  }

  .finder.busy .guide {
    border-color: #38bdf8;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.4);
  }

  /* Scanning Beam */
  .scan {
    position: absolute; 
    left: 0; 
    right: 0; 
    top: 0; 
    height: 3px; 
    display: none;
    background: linear-gradient(90deg, transparent 5%, #06b6d4 30%, #ec4899 50%, #a855f7 70%, transparent 95%);
    box-shadow: 0 0 20px 5px rgba(168, 85, 247, 0.7);
    z-index: 5;
  }

  .finder.busy .scan { 
    display: block; 
    animation: sweep 1.3s cubic-bezier(0.4, 0, 0.6, 1) infinite alternate; 
  }

  @keyframes sweep { 
    from { top: 4%; } 
    to { top: 96%; } 
  }

  @media (prefers-reduced-motion: reduce) {
    .finder.busy .scan { animation: none; top: 50%; }
  }

  /* Action Buttons & Controls */
  .controls { 
    display: flex; 
    flex-wrap: wrap; 
    gap: 14px; 
    margin-top: 22px; 
    align-items: center; 
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    border: 0; 
    border-radius: 999px; 
    padding: 14px 28px; 
    font-weight: 700;
    font-size: 0.98rem;
    letter-spacing: -0.01em;
    background: var(--accent-gradient); 
    color: #ffffff;
    box-shadow: 0 4px 20px var(--accent-glow);
  }

  .btn:hover:not(:disabled) { 
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(168, 85, 247, 0.55);
  }

  .btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .btn:disabled { 
    opacity: 0.35; 
    cursor: not-allowed; 
    box-shadow: none;
    transform: none;
  }

  /* Upload button styled as a refined secondary glass button */
  .link { 
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255, 255, 255, 0.06); 
    border: 1px solid var(--card-border); 
    padding: 13px 22px; 
    border-radius: 999px;
    color: var(--ink-muted); 
    text-decoration: none; 
    font-weight: 600;
    font-size: 0.94rem;
    backdrop-filter: blur(10px);
  }

  .link:hover:not(:disabled) { 
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.2);
    color: #ffffff;
    transform: translateY(-2px);
  }

  .link:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none;
  }

  .btn.quiet { 
    background: rgba(255, 255, 255, 0.05); 
    color: var(--ink); 
    border: 1px solid var(--card-border); 
    box-shadow: none;
  }

  .btn.quiet:hover:not(:disabled) { 
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.25);
    color: #ffffff;
  }

  /* Status and Notifications */
  #status { 
    min-height: 1.6em; 
    margin: 18px 0 0; 
    color: var(--cyan); 
    font-size: 0.92rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.3s ease;
  }

  #status:empty { display: none; }

  #status.error { 
    color: #f87171; 
  }

  .privacy { 
    margin: 20px 0 0; 
    font-size: 0.84rem; 
    color: var(--ink-dim); 
    max-width: 38rem; 
    display: flex;
    align-items: flex-start;
    gap: 8px;
    line-height: 1.5;
  }

  /* Results Card */
  .result { 
    background: var(--card); 
    border-radius: var(--radius-xl); 
    padding: 28px; 
    border: 1px solid var(--card-border); 
    backdrop-filter: blur(24px);
    box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    position: relative;
    overflow: hidden;
  }

  .result::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 3px;
    background: var(--accent-gradient);
  }

  .result[hidden] { display: none; }

  .result-header-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #f472b6;
    margin-bottom: 16px;
  }

  .pair { 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 16px; 
  }

  .photo {
    position: relative; 
    aspect-ratio: 3 / 4; 
    border-radius: var(--radius-md); 
    overflow: hidden;
    background: #111726; 
    display: flex; 
    align-items: center; 
    justify-content: center;
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }

  .photo img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    display: block; 
    transition: transform 0.4s ease;
  }

  .photo:hover img {
    transform: scale(1.03);
  }

  .photo figcaption {
    position: absolute; 
    left: 10px; 
    bottom: 10px; 
    background: rgba(9, 12, 20, 0.82); 
    color: #ffffff;
    font-size: 0.82rem; 
    font-weight: 600;
    padding: 4px 12px; 
    border-radius: 999px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  .initials { 
    font-family: "Syne", sans-serif; 
    font-size: 3.2rem; 
    font-weight: 800; 
    color: rgba(255, 255, 255, 0.25); 
  }

  figure { margin: 0; }

  .top h2 { 
    font-size: clamp(1.8rem, 4vw, 2.4rem); 
    margin-top: 22px; 
    letter-spacing: -0.02em; 
    color: #ffffff;
  }

  .score { 
    display: flex; 
    align-items: baseline; 
    gap: 12px; 
    margin-top: 8px; 
  }

  .score b { 
    font-family: "Syne", sans-serif; 
    font-size: 2.8rem; 
    line-height: 1; 
    background: linear-gradient(135deg, #f59e0b 0%, #ec4899 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .score span { 
    color: var(--ink-muted); 
    font-size: 1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .bar { 
    height: 10px; 
    background: rgba(255, 255, 255, 0.08); 
    border-radius: 999px; 
    overflow: hidden; 
    margin-top: 14px; 
    padding: 2px;
  }

  .bar > div { 
    height: 100%; 
    background: linear-gradient(90deg, #f59e0b, #ec4899, #a855f7); 
    border-radius: 999px; 
    transition: width 0.7s cubic-bezier(0.16, 1, 0.3, 1); 
    box-shadow: 0 0 14px rgba(236, 72, 153, 0.6);
  }

  @media (prefers-reduced-motion: reduce) { 
    .bar > div { transition: none; } 
  }

  /* Runner-up Matches */
  .others { 
    list-style: none; 
    margin: 26px 0 0; 
    padding: 20px 0 0; 
    border-top: 1px solid var(--card-border); 
    display: grid; 
    gap: 12px; 
  }

  .others h3 { 
    font-size: 0.95rem; 
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-muted);
    font-weight: 700;
    margin-bottom: 6px; 
  }

  .row { 
    display: grid; 
    grid-template-columns: 28px 48px 1fr auto; 
    gap: 14px; 
    align-items: center; 
    background: rgba(255, 255, 255, 0.03);
    padding: 10px 14px;
    border-radius: var(--radius-md);
    border: 1px solid rgba(255, 255, 255, 0.05);
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }

  .row:hover {
    background: rgba(255, 255, 255, 0.07);
    border-color: rgba(255, 255, 255, 0.12);
    transform: translateX(4px);
  }

  .rank-badge {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--ink-muted);
    text-align: center;
  }

  .thumb {
    width: 48px; 
    height: 48px; 
    border-radius: 50%; 
    overflow: hidden; 
    background: #111726;
    display: flex; 
    align-items: center; 
    justify-content: center;
    border: 2px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    flex-shrink: 0;
  }

  .thumb img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
  }

  .thumb .initials { 
    font-size: 1.1rem; 
    color: var(--ink-muted); 
  }

  .row-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .row .nm { 
    font-weight: 600; 
    color: #f1f5f9;
    font-size: 0.96rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row-tags {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .row .pc { 
    font-weight: 700; 
    font-size: 0.92rem;
    color: #fcd34d;
    background: rgba(245, 158, 11, 0.12);
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid rgba(245, 158, 11, 0.25);
  }



  .result .again { 
    margin-top: 20px; 
    width: 100%;
  }

  .visually-hidden { 
    position: absolute; 
    width: 1px; 
    height: 1px; 
    overflow: hidden; 
    clip: rect(0 0 0 0); 
    white-space: nowrap; 
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <div class="badge">
      <span class="badge-dot"></span>
      <span>Face Recognition AI</span>
    </div>
    <h1>Celebrity Face Matcher</h1>
    <p>Upload a portrait or use your camera to find your closest celebrity matches.</p>
  </header>

  <div class="layout">
    <section class="finder-wrapper" aria-label="Camera">
      <div class="finder" id="finder">
        <video id="video" playsinline muted></video>
        <div class="idle">
          <div class="idle-icon-wrap">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
          </div>
          <p>Camera is currently off. Start the camera and position your face inside the frame.</p>
          <button class="btn" id="startBtn" type="button">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
            </svg>
            Start Camera
          </button>
        </div>
        <div class="guide"></div>
        <div class="frame"><i></i><i></i><i></i><i></i></div>
        <div class="scan"></div>
      </div>

      <div class="controls">
        <button class="btn" id="captureBtn" type="button" disabled>
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="9"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m-3-3h6"/>
          </svg>
          Find Match
        </button>
        <button class="link" id="uploadBtn" type="button">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          Upload Photo
        </button>
        <input class="visually-hidden" id="fileInput" type="file" accept="image/*" tabindex="-1">
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="privacy">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="flex-shrink:0; margin-top:2px;">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
        </svg>
        <span>Photos are processed securely in memory and are not stored.</span>
      </p>
    </section>

    <section class="result" id="result" aria-label="Your result" hidden>
      <div class="result-header-badge" id="resultBadge">Top Match</div>
      <div class="top">
        <div class="pair">
          <figure class="photo"><img id="youImg" alt="Your photo"><figcaption>You</figcaption></figure>
          <figure class="photo" id="topPhoto"><figcaption id="topCaption">Closest Match</figcaption></figure>
        </div>
        <h2 id="topName"></h2>
        <div class="score"><b id="topPct"></b><span>Similarity</span></div>
        <div class="bar" aria-hidden="true"><div id="topBar"></div></div>
      </div>

      <ol class="others" id="others" aria-label="Alternative matches"></ol>



      <button class="btn quiet again" id="againBtn" type="button">Scan Another Photo</button>
    </section>
  </div>
</div>

<script>
  // Leave empty when the page is served by the FastAPI server (same address).
  const API_BASE = "http://127.0.0.1:8000";

  const $ = (id) => document.getElementById(id);
  const finder = $("finder"), video = $("video");
  const startBtn = $("startBtn"), captureBtn = $("captureBtn");
  const uploadBtn = $("uploadBtn"), fileInput = $("fileInput");
  const statusEl = $("status"), resultEl = $("result");
  let stream = null;

  function setStatus(text, isError) {
    statusEl.textContent = text || "";
    statusEl.classList.toggle("error", !!isError);
  }

  function setBusy(busy) {
    finder.classList.toggle("busy", busy);
    captureBtn.disabled = busy || !stream;
    uploadBtn.disabled = busy;
    if (busy) setStatus("Analyzing facial features and embeddings...");
  }

  async function startCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setStatus("The camera needs HTTPS or localhost. Open the site over HTTPS, or upload a photo instead.", true);
      return;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 960 } },
        audio: false,
      });
      video.srcObject = stream;
      await video.play();
      finder.classList.add("live");
      captureBtn.disabled = false;
      setStatus("Camera active. Align your face and click Find Match.");
    } catch (err) {
      stream = null;
      if (err && err.name === "NotAllowedError") {
        setStatus("Camera access was blocked. Allow it in your browser's site settings, or upload a photo instead.", true);
      } else if (err && err.name === "NotFoundError") {
        setStatus("No camera was found on this device. Upload a photo instead.", true);
      } else {
        setStatus("The camera couldn't start. Close other apps using it, or upload a photo instead.", true);
      }
    }
  }

  // Draw any image/video source onto a canvas (max 800px on the longest side) and return a JPEG blob.
  function toJpeg(source, w, h, mirror = false) {
    const scale = Math.min(1, 800 / Math.max(w, h));
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(w * scale);
    canvas.height = Math.round(h * scale);
    const ctx = canvas.getContext("2d");
    if (mirror) {
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
    }
    ctx.drawImage(source, 0, 0, canvas.width, canvas.height);
    return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.9));
  }

  let lastBlob = null;

  async function findLookalike(blob) {
    lastBlob = blob;
    setBusy(true);
    resultEl.hidden = true;
    const youUrl = URL.createObjectURL(blob);
    try {
      const form = new FormData();
      form.append("file", blob, "photo.jpg");
      const url = `${API_BASE}/match?gender=auto`;
      const res = await fetch(url, { method: "POST", body: form });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(typeof body.detail === "string" ? body.detail : "Something went wrong. Please try again.");
      }
      const data = await res.json();
      showResult(data, youUrl);
      setStatus("");
    } catch (err) {
      const offline = err instanceof TypeError;
      setStatus(offline ? "Couldn't reach the matcher. Check that the server is running." : err.message, true);
    } finally {
      setBusy(false);
    }
  }

  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join("");
  }

  // Put a celebrity photo in `box`; fall back to initials if the image can't load.
  function fillPhoto(box, match) {
    const img = new Image();
    img.alt = match.name;
    img.onerror = () => {
      img.remove();
      const s = document.createElement("span");
      s.className = "initials";
      s.textContent = initials(match.name);
      box.prepend(s);
    };
    img.src = API_BASE + match.image_url;
    box.prepend(img);
  }

  function pct(score) { return Math.round(score * 100); }

  function showResult(data, youUrl) {
    const matches = data.matches || [];
    if (!matches.length) {
      setStatus("No matching celebrities found.", true);
      return;
    }
    const best = data.best_overall || matches[0];
    const rest = matches.filter((m) => m.name !== best.name);

    $("youImg").src = youUrl;

    const topPhoto = $("topPhoto");
    topPhoto.querySelectorAll("img, .initials").forEach((n) => n.remove());
    fillPhoto(topPhoto, best);

    const badge = $("resultBadge");
    if (badge) {
      const g = data.detected_gender || "";
      const gIcon = g === "Female" ? "👩" : "👨";
      const gText = g ? ` • ${gIcon} ${g}` : "";
      badge.textContent = `Top Match${gText}`;
    }

    $("topName").textContent = best.name;
    $("topPct").textContent = pct(best.score) + "%";
    $("topBar").style.width = "0%";
    requestAnimationFrame(() => requestAnimationFrame(() => { $("topBar").style.width = pct(best.score) + "%"; }));

    // Alternative matches list
    const list = $("others");
    list.innerHTML = "";
    if (rest.length) {
      const head = document.createElement("li");
      const h = document.createElement("h3");
      h.textContent = "Alternative Matches";
      head.appendChild(h);
      list.appendChild(head);
    }

    rest.forEach((m, idx) => {
      const li = document.createElement("li");
      li.className = "row";

      const rank = document.createElement("span");
      rank.className = "rank-badge";
      rank.textContent = `#${idx + 2}`;

      const thumb = document.createElement("div");
      thumb.className = "thumb";
      fillPhoto(thumb, m);

      const nm = document.createElement("span");
      nm.className = "nm";
      nm.textContent = m.name;

      const pc = document.createElement("span");
      pc.className = "pc";
      pc.textContent = pct(m.score) + "%";

      li.append(rank, thumb, nm, pc);
      list.appendChild(li);
    });

    resultEl.hidden = false;
    resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

  startBtn.addEventListener("click", startCamera);

  captureBtn.addEventListener("click", async () => {
    if (!stream || !video.videoWidth) return;
    const blob = await toJpeg(video, video.videoWidth, video.videoHeight, true);
    findLookalike(blob);
  });

  uploadBtn.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", async () => {
    const file = fileInput.files[0];
    fileInput.value = "";
    if (!file) return;
    try {
      const bmp = await createImageBitmap(file);
      const blob = await toJpeg(bmp, bmp.width, bmp.height, false);
      findLookalike(blob);
    } catch (e) {
      setStatus("That file couldn't be read as an image. Try a JPG or PNG.", true);
    }
  });

  $("againBtn").addEventListener("click", () => {
    resultEl.hidden = true;
    lastBlob = null;
    setStatus(stream ? "Camera active. Align your face and click Find Match." : "");
    finder.scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  window.addEventListener("pagehide", () => {
    if (stream) stream.getTracks().forEach((t) => t.stop());
  });
</script>
</body>
</html>
